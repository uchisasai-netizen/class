              1 / 158
            </span>
          </div>
          <div class="flex items-center space-x-4 text-xs font-medium text-slate-400">
            <div>正解: <span id="score-correct" class="text-emerald-400 font-bold text-sm">0</span></div>
            <div>不正解: <span id="score-incorrect" class="text-rose-400 font-bold text-sm">0</span></div>
          </div>
        </div>

        <!-- Progress bar visual -->
        <div class="w-full bg-slate-700/50 h-2 rounded-full overflow-hidden mb-6">
          <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
        </div>

        <!-- Japanese Meaning Display -->
        <div class="min-h-[110px] flex flex-col justify-center items-center text-center p-4 bg-slate-900/60 rounded-xl border border-slate-700/50 mb-6">
          <span class="text-xs text-indigo-400 font-semibold tracking-wider uppercase mb-1">日本語の意味</span>
          <p id="japanese-meaning" class="text-lg md:text-xl font-bold text-slate-100 leading-relaxed">
            読み込み中...
          </p>
        </div>

        <!-- 4 Options Grid -->
        <div id="options-grid" class="grid grid-cols-1 gap-3 mb-6">
          <!-- Dynamic Buttons -->
        </div>

        <!-- Feedback & Action Footer -->
        <div class="min-h-[50px] flex items-center justify-between pt-2 border-t border-slate-700/50">
          <div id="feedback-message" class="text-sm font-bold flex items-center space-x-2">
            <!-- Dynamic feedback -->
          </div>
          <button id="next-btn" onclick="nextQuestion()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition items-center space-x-2">
            <span>次の問題</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </div>
      </div>

      <!-- RESULTS CARD (Hidden initially) -->
      <div id="result-card" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center shadow-2xl">
        <div class="w-20 h-20 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-3xl flex items-center justify-center mx-auto mb-4 text-3xl">

        </div>

      { en: "absolutely", ja: "①完全に，まったく　②絶対的に" },
      { en: "adult", ja: "成人，おとな／成人の" },
      { en: "kid", ja: "子ども／（を）からかう" },
      { en: "ancestor", ja: "先祖，祖先" },
      { en: "crowd", ja: "群衆／（に）群がる" },
      { en: "owner", ja: "所有者，持ち主" },
      { en: "speaker", ja: "①話す人，話者，演説者　②スピーカー" },
      { en: "captain", ja: "①キャプテン　②船長，機長" },
      { en: "author", ja: "著者，作者" },
      { en: "director", ja: "①指導者，重役　②（映画などの）監督　③指揮者" },
      { en: "immigrant", ja: "（外国からの）移民" },
      { en: "talent", ja: "①才能　②才能ある人々" },
      { en: "strict", ja: "①（人が）厳しい　②厳密な" },
      { en: "severe", ja: "①（人・規律が）厳しい　②（天候が）厳しい　③（痛みが）ひどい" },
      { en: "cruel", ja: "残酷な" },
      { en: "position", ja: "①位置，場所　②地位　③立場" },
      { en: "spot", ja: "①場所，地点　②はん点，しみ" },
      { en: "suburb", ja: "①《the suburbsで》郊外　②《a ～で》郊外の一地区" },
      { en: "region", ja: "①地方，地域　②領域　③（体などの）部分" },
      { en: "base", ja: "①土台　②基地／の基礎を置く" },
      { en: "locate", ja: "①（…の）場所・位置を示す ②《be located in...で》…に位置する" },
      { en: "upstairs", ja: "階上へ，2階へ" },
      { en: "downtown", ja: "繁華街・商業地区へ（で）／繁華街・商業地区の／（都市の）中心街，商業地区" },
      { en: "frame", ja: "①骨組み　②（窓などの）わく" },
      { en: "edge", ja: "①ふち，端　②（刃物の）刃" },
      { en: "surface", ja: "表面／表面の" },
      { en: "section", ja: "①区域，部分　②（新聞などの）欄" },
      { en: "elsewhere", ja: "どこかほかのところで" },
      { en: "everywhere", ja: "①どこでも，いたるところに　②どこで…しても" }
    ];

    let quizQuestions = [];
    let currentIndex = 0;
    let scoreCorrect = 0;
    let scoreIncorrect = 0;
    let isAnswered = false;

    // 配列シャッフル関数
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function restartQuiz() {
      // 全158問をランダム順にセット
      quizQuestions = shuffleArray(STRICT_WORDS);
      currentIndex = 0;
      scoreCorrect = 0;
      scoreIncorrect = 0;
      isAnswered = false;

      document.getElementById('quiz-card').classList.remove('hidden');
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('score-correct').innerText = "0";
      document.getElementById('score-incorrect').innerText = "0";

      renderQuestion();
    }

    function renderQuestion() {
      isAnswered = false;
      const currentWord = quizQuestions[currentIndex];
      
      // UI Counts
      document.getElementById('question-number').innerText = `${currentIndex + 1} / ${STRICT_WORDS.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIndex) / STRICT_WORDS.length) * 100}%`;
      
      // Japanese display
      document.getElementById('japanese-meaning').innerText = currentWord.ja;

      // Feedback & Next reset
      document.getElementById('feedback-message').innerHTML = '';
      const nextBtn = document.getElementById('next-btn');
      nextBtn.classList.add('hidden');
      nextBtn.classList.remove('flex');

      // 誤答の選択肢を「STRICT_WORDS」内のみから抽出（現在の単語以外から3個）
      const remainingCandidates = STRICT_WORDS.filter(w => w.en !== currentWord.en);
      const wrongChoices = shuffleArray(remainingCandidates).slice(0, 3);
      
      // 正解と誤答を混ぜる
      const fourOptions = shuffleArray([currentWord, ...wrongChoices]);

      // Render Option Buttons
      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';

      fourOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn w-full text-left font-semibold text-slate-200 bg-slate-900/90 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-xl transition duration-150 flex items-center justify-between group';
        btn.setAttribute('data-en', opt.en);
        
        btn.innerHTML = `
          <span class="text-base">${opt.en}</span>
          <i class="fa-regular fa-circle text-slate-600 group-hover:text-indigo-400 text-lg transition-colors status-icon"></i>
        `;

        btn.onclick = () => handleChoiceSelect(btn, opt.en, currentWord.en);
        grid.appendChild(btn);
      });
    }

    function handleChoiceSelect(selectedBtn, chosenEn, correctEn) {
      if (isAnswered) return;
      isAnswered = true;

      const allOptionBtns = document.querySelectorAll('.option-btn');
      const feedback = document.getElementById('feedback-message');
      const nextBtn = document.getElementById('next-btn');

      allOptionBtns.forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('hover:bg-slate-700/80');
        const icon = btn.querySelector('.status-icon');
        const btnEn = btn.getAttribute('data-en');

        if (btnEn === correctEn) {
          // 正解のボタンハイライト
          btn.classList.remove('bg-slate-900/90', 'border-slate-700');
          btn.classList.add('bg-emerald-950/80', 'border-emerald-500', 'text-emerald-200');
          icon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
        }
      });

      if (chosenEn === correctEn) {
        scoreCorrect++;
        document.getElementById('score-correct').innerText = scoreCorrect;
        feedback.className = "text-sm font-bold text-emerald-400 flex items-center space-x-1.5";
        feedback.innerHTML = `<i class="fa-solid fa-circle-check text-base"></i><span>正解です！</span>`;
      } else {
        scoreIncorrect++;
        document.getElementById('score-incorrect').innerText = scoreIncorrect;
        selectedBtn.classList.remove('bg-slate-900/90', 'border-slate-700');
        selectedBtn.classList.add('bg-rose-950/80', 'border-rose-500', 'text-rose-200');
        const icon = selectedBtn.querySelector('.status-icon');
        icon.className = 'fa-solid fa-circle-xmark text-rose-400 text-lg';

        feedback.className = "text-sm font-bold text-rose-400 flex items-center space-x-1.5";
        feedback.innerHTML = `<i class="fa-solid fa-circle-xmark text-base"></i><span>不正解（正解: <span class="underline">${correctEn}</span>）</span>`;
      }

      nextBtn.classList.remove('hidden');
      nextBtn.classList.add('flex');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < STRICT_WORDS.length) {
        renderQuestion();
      } else {
        showFinalResults();
      }
    }

    function showFinalResults() {
      document.getElementById('quiz-card').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');

      document.getElementById('final-score').innerText = `${scoreCorrect} / ${STRICT_WORDS.length}`;
      const accuracy = Math.round((scoreCorrect / STRICT_WORDS.length) * 100);
      document.getElementById('accuracy-rate').innerText = `正解率: ${accuracy}%`;
    }

    // アプリ起動時の初期化
    window.onload = function() {
      restartQuiz();
    };
  </script>
</body>
</html>
